<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Аутентификация, cookies и сессии</title>
</head>
<body>
    <h1>Практическая работа: аутентификация, cookies и сессии</h1>

    {% if user.is_authenticated %}
        <p>Вы вошли как: <strong>{{ user.username }}</strong></p>
        <p><a href="{% url 'myauth:logout' %}">Выйти</a></p>
    {% else %}
        <p>Вы не авторизованы.</p>
        <p><a href="{% url 'myauth:login' %}">Войти</a></p>
    {% endif %}

    <h2>Cookies</h2>
    <ul>
        <li>
            <a href="{% url 'myauth:set_cookie' %}">
                Установить cookie
            </a>
        </li>
        <li>
            <a href="{% url 'myauth:get_cookie' %}">
                Прочитать cookie
            </a>
        </li>
    </ul>

    <h2>Сессии</h2>
    <ul>
        <li>
            <a href="{% url 'myauth:set_session' %}">
                Установить session
            </a>
        </li>
        <li>
            <a href="{% url 'myauth:get_session' %}">
                Прочитать session
            </a>
        </li>
    </ul>
</body>
</html>

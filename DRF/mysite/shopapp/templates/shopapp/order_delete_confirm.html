{% extends 'base.html' %}

{% block title %}Удаление заказа{% endblock %}

{% block content %}
<h1>Удаление заказа</h1>

<p>
    Вы уверены, что хотите навсегда удалить заказ №{{ order.pk }}?
</p>

<p>
    Пользователь: <strong>{{ order.customer }}</strong>
</p>

<form method="post">
    {% csrf_token %}
    <button type="submit">Да, удалить заказ</button>
</form>

<p>
    <a href="{% url 'shopapp:order_detail' order.pk %}">
        Нет, вернуться к заказу
    </a>
</p>
{% endblock %}

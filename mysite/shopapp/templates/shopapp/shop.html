{% extends 'base.html' %}

{% block title %}Магазин{% endblock %}

{% block content %}
<h1>Товары</h1>

{% if products %}
    <ul>
    {% for product in products %}
        <li>
            <strong>{{ product.name }}</strong> - ${{ product.price }}
        </li>
    {% endfor %}
    </ul>
{% else %}
    <p>Товары не найдены</p>
{% endif %}

{% endblock %}

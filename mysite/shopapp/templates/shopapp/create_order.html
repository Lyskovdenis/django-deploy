{% extends 'base.html' %}

{% block title %}Создание заказа{% endblock %}

{% block content %}
<h1>Создание заказа</h1>

{% if messages %}
    {% for message in messages %}
        <div style="padding: 10px; margin: 10px 0; border-radius: 5px; {% if message.tags == 'error' %}background-color: #f8d7da; color: #721c24{% else %}background-color: #d4edda; color: #155724{% endif %}">
            {{ message }}
        </div>
    {% endfor %}
{% endif %}

<form method="post">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit">Создать заказ</button>
</form>

<br>
<a href="{% url 'shopapp:orders' %}">Назад к заказам</a> | 
<a href="{% url 'shopapp:index' %}">На главную</a>
{% endblock %}
